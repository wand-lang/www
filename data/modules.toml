# The standard library pages: each module's group, and the line its card
# shows. The order here is the order on the page. A module that `wand d`
# lists and this file does not is still built, under "Other", and the
# build says so.

[[module]]
name = "List"
group = "Collections and text"
blurb = "In memory and finite: the one you can sort, and read twice without paying twice."

[[module]]
name = "String"
group = "Collections and text"
blurb = "Measured in bytes, not characters. Slices between two indices."

[[module]]
name = "Stream"
group = "Collections and text"
blurb = "Reading through, without reading in. Read once, and may not end."

[[module]]
name = "Map"
group = "Collections and text"
blurb = "Keeps its entries in the order they were first added, not key order."

[[module]]
name = "Regex"
group = "Collections and text"
blurb = "Compile a pattern, then match, find and replace with it."

[[module]]
name = "FS"
group = "Files and processes"
blurb = "Read, write and publish files. Each fallible operation has a ! sibling."

[[module]]
name = "Path"
group = "Files and processes"
blurb = "Join two path segments, and take a path apart."

[[module]]
name = "Glob"
group = "Files and processes"
blurb = "Matching a path against a pattern, without reading the disk to do it."

[[module]]
name = "Shell"
group = "Files and processes"
blurb = "Run a Command built with $*(), or query it for a result to examine."

[[module]]
